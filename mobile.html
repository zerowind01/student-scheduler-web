<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LessonMate - 手机版</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  <meta name="apple-mobile-web-app-title" content="LessonMate">
  <meta name="theme-color" content="#f59e0b">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <!-- GSAP 动效 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/anim.js"></script>
</head>
<body class="text-slate-800 font-sans h-[100dvh] flex flex-col overflow-hidden select-none" style="background: var(--surface-page);">

  <!-- 手机端 App 顶栏 Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-amber-100 px-4 py-2.5 flex items-center justify-between shadow-2xs shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-xs shrink-0">
        <i class="fa-solid fa-mobile-screen text-base"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-slate-800 tracking-tight">LessonMate <span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded-md font-semibold">手机版</span></h1>
      </div>
    </div>

    <!-- 顶部老师筛选 -->
    <div class="flex items-center space-x-1.5">
      <div class="flex items-center space-x-1 bg-amber-50/80 border border-amber-200/80 px-2 py-1 rounded-lg text-xs font-semibold text-amber-900 shadow-2xs">
        <i class="fa-solid fa-chalkboard-user text-amber-600 text-[11px]"></i>
        <select id="mobileTeacherSelect" aria-label="筛选老师" class="bg-white border border-amber-200 rounded-md px-1 py-0.5 text-xs font-bold text-slate-800 outline-none focus:ring-1 focus:ring-amber-400 max-w-[110px]">
          <option value="all">全部老师</option>
          <!-- 动态注入老师选项 -->
        </select>
      </div>
      <a href="index.html" class="text-[11px] text-slate-500 hover:text-amber-600 bg-slate-100 px-2 py-1 rounded-lg font-medium transition" title="切换至电脑完整版">
        <i class="fa-solid fa-desktop mr-0.5"></i> 电脑版
      </a>
    </div>
  </header>

  <!-- 手机版 日期导航栏 (3日/1日 滚动控制) -->
  <div id="mobileDateBar" class="bg-white border-b border-slate-100 px-3 py-2 flex items-center justify-between text-xs shrink-0 z-10 shadow-2xs">
    <div class="flex items-center space-x-1">
      <button id="btnMobilePrev" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold transition flex items-center gap-1">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> 前3天
      </button>
      <button id="btnMobileToday" class="px-3 py-1 bg-amber-500 text-white rounded-lg font-bold shadow-2xs transition">
        今天
      </button>
      <button id="btnMobileNext" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold transition flex items-center gap-1">
        后3天 <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
    <span id="mobileDateText" class="font-bold text-slate-800 text-xs text-right truncate">
      9月1日 - 9月3日
    </span>
  </div>

  <!-- 手机端 主视图 (课表视图 vs 学员列表) -->
  <main class="flex-1 overflow-hidden relative bg-slate-50">

    <!-- 1. 手机端 3日课表日历视图 -->
    <div id="viewSchedule" class="h-full flex flex-col overflow-hidden">
      <!-- 3日 header -->
      <div class="bg-white border-b border-slate-200 flex items-center shadow-2xs z-10 shrink-0">
        <div class="w-12 shrink-0 py-2 text-center text-[11px] text-slate-400 font-semibold border-r border-slate-100">
          时间
        </div>
        <div id="mobileHeaderDays" class="grid grid-cols-3 flex-1 divide-x divide-slate-100 text-center py-1.5 font-bold">
          <!-- 动态渲染 3 天标题 -->
        </div>
      </div>

      <!-- 3日 课表 Body -->
      <div id="mobileCalendarScroll" class="flex-1 overflow-y-auto relative custom-scrollbar">
        <div class="flex min-h-[832px] relative">
          <!-- 时间刻度轴 08:00 - 21:00 -->
          <div class="w-12 shrink-0 bg-slate-50/90 border-r border-slate-200 text-[10px] text-slate-400 font-mono flex flex-col justify-between py-2 select-none">
            <div class="time-slot-label">08:00</div>
            <div class="time-slot-label">09:00</div>
            <div class="time-slot-label">10:00</div>
            <div class="time-slot-label">11:00</div>
            <div class="time-slot-label">12:00</div>
            <div class="time-slot-label">13:00</div>
            <div class="time-slot-label">14:00</div>
            <div class="time-slot-label">15:00</div>
            <div class="time-slot-label">16:00</div>
            <div class="time-slot-label">17:00</div>
            <div class="time-slot-label">18:00</div>
            <div class="time-slot-label">19:00</div>
            <div class="time-slot-label">20:00</div>
            <div class="time-slot-label">21:00</div>
          </div>

          <!-- 3天 日历列网格 -->
          <div id="mobileGridColumns" class="grid grid-cols-3 flex-1 divide-x divide-slate-200/80 relative">
            <!-- 动态渲染 3列 Day Column -->
          </div>

          <!-- 水平分割虚线 -->
          <div class="absolute inset-0 left-12 pointer-events-none grid grid-rows-13 divide-y divide-slate-200/40">
            <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 手机端 学员名册视图 -->
    <div id="viewStudents" class="h-full flex flex-col overflow-hidden hidden bg-white p-3">
      <div class="space-y-2 pb-3 border-b border-slate-100">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          <div class="flex items-center gap-2">
            <input type="text" id="mobileSearchStudent" placeholder="搜索学员姓名/科目…" class="flex-1 min-w-0 pl-8 pr-3 py-2.5 text-xs border border-slate-200 rounded-xl outline-none focus:ring-1 focus:ring-amber-400">
            <button id="btnMobileAddStudent"
                    class="shrink-0 px-3 py-2.5 bg-amber-500 text-white rounded-xl font-bold text-xs shadow-xs flex items-center gap-1 active:bg-amber-600 transition"
                    title="新增学员">
              <i class="fa-solid fa-user-plus text-[11px]"></i> 新增
            </button>
          </div>
        </div>
        <div class="flex items-center space-x-1.5 text-xs">
          <button class="mobile-student-filter active px-2.5 py-1 rounded-lg bg-amber-500 text-white font-bold" data-filter="all">全部学员</button>
          <button class="mobile-student-filter px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium" data-filter="low">课时预警(≤2)</button>
        </div>
      </div>

      <!-- 学员列表列表 -->
      <div id="mobileStudentContainer" class="flex-1 overflow-y-auto py-3 space-y-2 custom-scrollbar">
        <!-- 动态学员卡片 -->
      </div>
    </div>

    <!-- 3. 手机端 财务视图 -->
    <div id="viewFinance" class="h-full flex flex-col overflow-hidden hidden bg-slate-50">
      <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
        <div id="mobileFinanceContent" class="space-y-3">
          <!-- 动态渲染财务面板 -->
        </div>
      </div>
    </div>

    <!-- 4. 手机端 设置视图 -->
    <div id="viewSettings" class="h-full flex flex-col overflow-hidden hidden bg-slate-50">
      <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <button id="msetCloudSync" class="p-4 bg-white border border-slate-200 rounded-2xl text-left active:bg-slate-50">
            <div class="font-bold text-xs text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-cloud-arrow-up text-sky-600"></i> 实时云同步</div>
            <div class="text-[10px] text-slate-400 mt-1">多设备实时互通</div>
          </button>
          <button id="msetManageTeachers" class="p-4 bg-white border border-slate-200 rounded-2xl text-left active:bg-slate-50">
            <div class="font-bold text-xs text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-chalkboard-user text-emerald-600"></i> 教师管理</div>
            <div class="text-[10px] text-slate-400 mt-1">添加/编辑老师</div>
          </button>
          <button id="msetExport" class="p-4 bg-white border border-slate-200 rounded-2xl text-left active:bg-slate-50">
            <div class="font-bold text-xs text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-download text-rose-500"></i> 导出数据</div>
            <div class="text-[10px] text-slate-400 mt-1">备份全部数据</div>
          </button>
          <a href="index.html" class="p-4 bg-white border border-slate-200 rounded-2xl text-left active:bg-slate-50 block">
            <div class="font-bold text-xs text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-desktop text-amber-600"></i> 电脑完整版</div>
            <div class="text-[10px] text-slate-400 mt-1">全部高级功能</div>
          </a>
        </div>
        <div class="text-center text-[10px] text-slate-300 pt-2">LessonMate · 手机版</div>
      </div>
    </div>

  </main>

  <!-- 手机端 App 底部导航栏 -->
  <nav class="mobile-bottom-nav bg-white border-t border-slate-200 px-3 flex items-center justify-between shrink-0 shadow-lg z-30">
    <button id="navTabSchedule" class="nav-tab flex flex-col items-center gap-0.5 font-bold text-[10px] px-2 text-amber-600" data-view="schedule">
      <i class="fa-solid fa-calendar-week text-base fn-schedule is-active"></i>
      <span>课表</span>
    </button>
    <button id="navTabStudents" class="nav-tab flex flex-col items-center gap-0.5 text-slate-400 font-medium text-[10px] px-2" data-view="students">
      <i class="fa-solid fa-users text-base fn-students"></i>
      <span>学员</span>
    </button>
    <button id="navTabQuickAdd" aria-label="新增" class="flex flex-col items-center justify-center -mt-5 w-12 h-12 rounded-full bg-gradient-to-tr from-amber-500 to-orange-400 text-white shadow-lg shadow-orange-200 border-4 border-white transition active:scale-95">
      <i class="fa-solid fa-plus text-lg"></i>
    </button>
    <button id="navTabFinance" class="nav-tab flex flex-col items-center gap-0.5 text-slate-400 font-medium text-[10px] px-2 relative" data-view="finance">
      <i class="fa-solid fa-coins text-base fn-finance"></i>
      <span>财务</span>
      <span id="mobileNavDebtBadge" class="hidden absolute top-0 right-0.5 w-2 h-2 rounded-full bg-rose-500"></span>
    </button>
    <button id="navTabSettings" class="nav-tab flex flex-col items-center gap-0.5 text-slate-400 font-medium text-[10px] px-2" data-view="settings">
      <i class="fa-solid fa-gear text-base fn-settings"></i>
      <span>设置</span>
    </button>
  </nav>

  <!-- 手机端 安排新课程 Modal 弹窗 -->
  <div id="modalMobileSchedule" role="dialog" aria-modal="true" aria-labelledby="modalMobileScheduleTitle" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-end justify-center z-50 hidden transition-opacity">
    <div class="bg-white rounded-t-3xl shadow-2xl border-t border-amber-200 w-full max-h-[92vh] overflow-y-auto p-5 space-y-3.5 text-xs transform transition-all modal-box">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 id="modalMobileScheduleTitle" class="font-bold text-base text-slate-800">安排新课程</h3>
        <button id="btnCloseMobileSchedule" aria-label="关闭" class="text-slate-400 hover:text-slate-700 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="formMobileSchedule" autocomplete="off" class="space-y-3">
        <input type="hidden" id="inputMobileScheduleId">

        <!-- 选择学员 -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">选择学员 <span class="text-rose-500">*</span></label>
          <select id="selectMobileStudent" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 bg-amber-50/50 outline-none focus:ring-1 focus:ring-amber-400">
            <!-- 动态装载学员 -->
          </select>
        </div>

        <!-- 选择课程 -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">本次上课课程 <span class="text-rose-500">*</span></label>
          <select id="selectMobileCourse" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 bg-white outline-none focus:ring-1 focus:ring-amber-400">
            <!-- 动态装载选中学员的课程 -->
          </select>
        </div>

        <!-- 日期与时间 -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block font-medium text-slate-700 mb-1">上课日期</label>
            <input type="date" id="inputMobileDate" required class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none focus:ring-1 focus:ring-amber-400">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">开始时间</label>
            <input type="time" id="inputMobileStartTime" required step="900" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none focus:ring-1 focus:ring-amber-400">
          </div>
        </div>

        <!-- 时长 & 课室 -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block font-medium text-slate-700 mb-1">课程时长</label>
            <select id="selectMobileDuration" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none bg-white">
              <option value="30">30 分钟 (0.5课时)</option>
              <option value="45">45 分钟 (0.75课时)</option>
              <option value="60" selected>60 分钟 (1课时)</option>
              <option value="90">90 分钟 (1.5课时)</option>
              <option value="120">120 分钟 (2课时)</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">上课教室</label>
            <input type="text" id="inputMobileRoom" placeholder="如：琴房 101" required class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none font-semibold">
          </div>
        </div>

        <!-- 老师配置 -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block font-medium text-slate-700 mb-1">主讲老师 <span class="text-rose-500">*</span></label>
            <select id="selectMobileTeacher" required class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none bg-white font-semibold">
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">共上/助教老师</label>
            <select id="selectMobileAssistant" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none bg-white">
              <option value="">无 (单师上课)</option>
            </select>
          </div>
        </div>

        <!-- 重复排课（仅新增时显示） -->
        <div id="mobileRepeatOptionsBlock" class="bg-sky-50/70 border border-sky-100 rounded-xl p-2.5 space-y-2">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block font-medium text-slate-700 mb-1"><i class="fa-solid fa-repeat text-sky-500 mr-1"></i>重复排课</label>
              <select id="selectMobileRepeatRule" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none bg-white font-semibold">
                <option value="none" selected>不重复</option>
                <option value="weekly">每周</option>
                <option value="biweekly">隔周</option>
              </select>
            </div>
            <div id="mobileRepeatEndDateWrap" class="hidden">
              <label class="block font-medium text-slate-700 mb-1">重复到</label>
              <input type="date" id="inputMobileRepeatEndDate" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none">
            </div>
          </div>
          <div id="mobileRepeatHint" class="text-[10px] text-sky-600/80 hidden">💡 将按以上时间重复生成排课，冲突的日期自动跳过</div>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-slate-100">
          <button type="button" id="btnDeleteMobileSchedule" class="px-3 py-2 text-rose-600 bg-rose-50 rounded-xl font-bold transition hidden">
            删除
          </button>
          <div class="flex items-center space-x-2 ml-auto">
            <button type="button" id="btnCancelMobileSchedule" class="px-4 py-2 text-slate-600 bg-slate-100 rounded-xl font-medium">
              取消
            </button>
            <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold shadow-md shadow-amber-200">
              保存排课
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 手机端 学员详情 Modal 弹窗 (底部抽屉式) -->
  <div id="modalMobileStudentDetail" role="dialog" aria-modal="true" aria-labelledby="mobileStudentDetailTitle" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-end justify-center z-50 hidden transition-opacity">
    <div class="bg-white rounded-t-3xl shadow-2xl border-t border-sky-200 w-full max-h-[88dvh] overflow-y-auto p-5 space-y-3.5 text-xs transform transition-all modal-box">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 id="mobileStudentDetailTitle" class="font-bold text-base text-slate-800">学员详情</h3>
        <button id="btnCloseMobileStudentDetail" aria-label="关闭" class="text-slate-400 hover:text-slate-700 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div id="mobileStudentDetailBody" class="space-y-3.5 pb-4">
        <!-- JS 渲染 -->
      </div>
    </div>
  </div>

  <!-- 云端实时同步设置 Modal 弹窗 -->
  <!-- 手机端 新增/编辑学员 Modal 弹窗 (适配手机: 底部抽屉式 + 大号触控区域) -->
  <div id="modalMobileStudent" role="dialog" aria-modal="true" aria-labelledby="modalMobileStudentTitle" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-end justify-center z-50 hidden transition-opacity">
    <div class="bg-white rounded-t-3xl shadow-2xl border-t border-amber-200 w-full max-h-[92dvh] overflow-y-auto p-5 space-y-3.5 text-xs transform transition-all modal-box">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 id="modalMobileStudentTitle" class="font-bold text-base text-slate-800">添加新学员</h3>
        <button id="btnCloseMobileStudent" aria-label="关闭" class="text-slate-400 hover:text-slate-700 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="formMobileStudent" autocomplete="off" class="space-y-3">
        <input type="hidden" id="editMobileStudentId">

        <!-- 姓名 (整行大号输入框, 手机上好按) -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">学员姓名 <span class="text-rose-500">*</span></label>
          <input type="text" id="mobileStudentNameInput" required placeholder="如：李小明"
                 class="w-full px-3.5 py-3 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-amber-400 bg-amber-50/40">
        </div>

        <!-- 联系电话 + 卡片颜色 -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block font-medium text-slate-700 mb-1">联系电话</label>
            <input type="tel" id="mobileStudentPhoneInput" placeholder="138****0000"
                   class="w-full px-3 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-amber-400">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">卡片颜色</label>
            <select id="mobileStudentColorSelect"
                    class="w-full px-3 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-amber-400 bg-white font-semibold">
              <option value="amber">暖阳橙</option>
              <option value="emerald">薄荷绿</option>
              <option value="sky">天空蓝</option>
              <option value="purple">优雅紫</option>
              <option value="rose">珊瑚粉</option>
            </select>
          </div>
        </div>

        <!-- 报读课程列表 -->
        <div class="bg-slate-50 border border-slate-200/80 p-3 rounded-xl space-y-2">
          <div class="flex items-center justify-between">
            <label class="block font-bold text-slate-700">报读课程及剩余课时</label>
            <button type="button" id="btnAddMobileCourseRow"
                    class="text-amber-600 font-bold text-[11px] flex items-center gap-1 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200 active:bg-amber-100 transition">
              <i class="fa-solid fa-plus text-[10px]"></i> 添加课程
            </button>
          </div>
          <div id="mobileStudentCoursesContainer" class="space-y-2">
            <!-- 动态课程行 -->
          </div>
        </div>

        <!-- 操作按钮 (大号, 手机易点) -->
        <div class="flex items-center justify-between pt-3 border-t border-slate-100 gap-2">
          <button type="button" id="btnDeleteMobileStudent"
                  class="px-4 py-3 text-rose-600 bg-rose-50 rounded-xl font-bold transition hidden">
            删除
          </button>
          <div class="flex items-center space-x-2 ml-auto">
            <button type="button" id="btnCancelMobileStudent"
                    class="px-4 py-3 text-slate-600 bg-slate-100 rounded-xl font-medium active:bg-slate-200">
              取消
            </button>
            <button type="submit"
                    class="px-5 py-3 bg-amber-500 text-white rounded-xl font-bold shadow-md shadow-amber-200 active:bg-amber-600">
              保存学员
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="modalSyncKey" role="dialog" aria-modal="true" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 hidden transition-opacity p-2 sm:p-0">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full sm:w-[420px] max-h-[92vh] overflow-y-auto transform transition-all scale-95 opacity-0 modal-box">
      <div class="bg-amber-500 px-5 py-3.5 text-white flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-amber-100 text-base"></i>
          <h3 class="font-bold text-sm sm:text-base">云端跨设备实时同步设置</h3>
        </div>
        <button id="btnCloseSyncModal" aria-label="关闭" class="text-amber-100 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-5 space-y-4 text-xs">
        <div class="bg-amber-50 border border-amber-200/80 p-3 rounded-xl text-amber-900 leading-relaxed">
          <i class="fa-solid fa-lightbulb text-amber-600 mr-1"></i>
          可通过<strong>极速剪贴板代码同步（100%成功）</strong>或<strong>机构云同步码</strong>完成多端课表连通。
        </div>

        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2">
          <label class="block font-bold text-slate-800">⚡ 方式一：极速同步码（微信/剪贴板 100% 成功）</label>
          <div class="flex items-center gap-2">
            <button type="button" id="btnCopyQuickSyncCode" class="flex-1 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-copy"></i> 复制排课代码
            </button>
            <button type="button" id="btnPasteQuickSyncCode" class="flex-1 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-paste"></i> 粘贴同步代码
            </button>
          </div>
        </div>

        <div class="space-y-2 pt-1">
          <label class="block font-bold text-slate-800">☁️ 方式二：机构专属云同步码（实时轮询）</label>
          <input type="text" id="inputSyncKey" required placeholder="如：my_school_2026" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-amber-400 font-bold text-slate-800">
        </div>

        <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100">
          <button type="button" id="btnCancelSyncModal" class="px-3.5 py-1.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-medium">
            取消
          </button>
          <button type="button" id="btnSaveSyncKey" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold shadow-xs transition">
            保存云同步码
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 提示 Toast 通知 -->
  <div id="toast" role="status" aria-live="polite" class="fixed toast-safe-bottom left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-2xl shadow-xl text-xs font-medium flex items-center space-x-2 z-50 transform transition-all translate-y-10 opacity-0 pointer-events-none whitespace-nowrap">
    <i id="toastIcon" class="fa-solid fa-circle-check text-amber-400"></i>
    <span id="toastMsg">操作成功</span>
  </div>

  <!-- 手机版专属 JavaScript 代码 -->
  <script src="js/mobile.js"></script>
</body>
</html>
